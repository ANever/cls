MODEL:    
  dim_sizes: np.array([30])
  area_lims: np.array([[-1., 1.]])
  power: 5

WEIGHTS:
    border_weight: 200
    colloc_weight: 1.5
    connect_weights: np.array([20, 10]) * 0.75

NS:
  nx: [100, 100]

IN_VAR_NAMES:
 [t]

OUT_VAR_NAMES:
 ['S', 'I', 'uS', 'uI']

CUSTOMS:
    beta_max: 20. #'lambda u_: u_(func=4)', #20,
    cost_inf: 4.
    gamma: 2
    S0: 0.7
    c: 'lambda u_: np.abs(beta_max *( uI - uS ) * I / 2.)'
    approximation: 'lambda u_: -6.63320111e-01 + np.sqrt(c(u_)) *8.92654544e-01 - c(u_) * 6.99385982e-02 + c(u_)**2* 2.97831057e-04 - c(u_)**3 * 1.08549568e-06 + c(u_)**4*1.68015701e-09 +np.exp(-c(u_))*  3.66041065e-02 + np.exp(-2*c(u_))*  4.74148560e-01'
    c_sign: 'lambda u_: np.sign( - ( uI - uS ))'
    alpha: 'lambda u_: c_sign(u_) * approximation(u_)'
    beta: 'lambda u_: beta_max/(1+np.exp(-alpha(u_)))'
    small: 0.00001
    border_weight: 1.

COLLOC_OPS:
  left: 
    - '- (d/dt) S - beta(u_loc) * ( S * &I ) '
    - '- (d/dt) I + beta(u_loc) * ( S * &I ) - gamma * I '
    - '- (d/dt) uS - ( beta(u_loc) * I * ( - uS + uI ))'
    - '- (d/dt) uI - ( -gamma * uI )'
  right: 
    - '0'
    - '0'
    - 'alpha(u_loc)**2'
    - 'cost_inf'

BORDER_OPS:
  left: 
    - 'int(x[0] < sol.area_lims[0, 0] + small) * (u_bas([0], 0)) * border_weight'
    - 'int(x[0] < sol.area_lims[0, 0] + small) * (u_bas([0], 1)) * border_weight'
    - 'int(x[0] > sol.area_lims[0, 1] - small) * (u_bas([0], 2)) * border_weight'
    - 'int(x[0] > sol.area_lims[0, 1] - small) * (u_bas([0], 3)) * border_weight'
  right: 
    - 'int(x[0] < sol.area_lims[0, 0] + small) * ( S0 ) * border_weight'
    - 'int(x[0] < sol.area_lims[0, 0] + small) * ( 1 - S0 ) * border_weight'
    - '0 * border_weight'
    - '0 * border_weight'

CONNECT_POINTS: '[[1.],[-1.]]'
